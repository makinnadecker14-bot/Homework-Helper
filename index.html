<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Homework Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
      background:
        linear-gradient(rgba(10, 55, 25, 0.92), rgba(7, 45, 20, 0.96)),
        repeating-linear-gradient(
          45deg,
          #193b24 0px,
          #193b24 18px,
          #294c2b 18px,
          #294c2b 35px,
          #102f1b 35px,
          #102f1b 55px
        );
    }

    header {
      padding: 22px 30px;
      background: rgba(5, 35, 17, 0.95);
      border-bottom: 2px solid #5d8f50;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    .container {
      width: min(900px, 92%);
      margin: 35px auto;
    }

    .card {
      background: rgba(10, 45, 22, 0.94);
      border: 2px solid #5d8f50;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .intro p {
      margin: 0;
      color: #d7ead2;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .subject {
      border: 1px solid #719f65;
      background: #244b2b;
      color: white;
      border-radius: 12px;
      padding: 13px 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .subject:hover,
    .subject.active {
      background: #4d7f42;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 2px solid #719f65;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      outline: none;
      background: #f5f8f3;
      color: #17351e;
    }

    textarea:focus {
      border-color: #a7d49b;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      font-family: inherit;
    }

    .help {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #76a865;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .help:hover {
      background: #8dbc7b;
    }

    .upload {
      border: 2px solid #719f65;
      border-radius: 12px;
      padding: 15px 20px;
      background: #244b2b;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #fileInput {
      display: none;
    }

    .answer {
      margin-top: 22px;
      background: #f5f8f3;
      color: #17351e;
      border-radius: 14px;
      padding: 20px;
      min-height: 100px;
      white-space: pre-wrap;
      line-height: 1.6;
      border: 2px solid #719f65;
    }

    .answer-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #24552d;
    }

    .loading {
      color: #416f45;
      font-style: italic;
    }

    .recent {
      margin-top: 25px;
    }

    .recent h2 {
      font-size: 20px;
    }

    .recent-item {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(180,220,170,0.3);
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .subjects {
        grid-template-columns: repeat(2, 1fr);
      }

      .buttons {
        flex-direction: column;
      }

      header {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>📚 Homework Helper</header>

<div class="container">

  <div class="card">

    <div class="intro">
      <h1>🌲 Homework Helper</h1>
      <p>Ask a question and get help from your AI tutor.</p>
    </div>

    <div class="subjects">
      <button class="subject active" onclick="selectSubject(this, 'Math')">➗ Math</button>
      <button class="subject" onclick="selectSubject(this, 'Science')">🔬 Science</button>
      <button class="subject" onclick="selectSubject(this, 'English')">📖 English</button>
      <button class="subject" onclick="selectSubject(this, 'History')">🏛️ History</button>
    </div>

    <textarea
      id="question"
      placeholder="Type your homework question..."
    ></textarea>

    <div class="buttons">

      <label class="upload">
        📷 Upload
        <input id="fileInput" type="file" accept="image/*">
      </label>

      <button class="help" onclick="getHelp()">
        🌲 Get Help
      </button>

    </div>

    <div id="answer" class="answer">
      <div class="answer-title">💡 Your answer will appear here</div>
      Ask me a homework question!
    </div>

    <div class="recent">
      <h2>📝 Recent Questions</h2>
      <div id="recentQuestions"></div>
    </div>

  </div>

</div>

<script>

  let selectedSubject = "Math";

  function selectSubject(button, subject) {
    document.querySelectorAll(".subject").forEach(function(btn) {
      btn.classList.remove("active");
    });

    button.classList.add("active");
    selectedSubject = subject;
  }

  document.getElementById("fileInput").addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    document.getElementById("question").value =
      "I uploaded a homework picture called " +
      file.name +
      ". Please help me with this homework.";

  });

  async function getHelp() {

    const questionBox = document.getElementById("question");
    const answerBox = document.getElementById("answer");

    const question = questionBox.value.trim();

    if (!question) {
      answerBox.innerHTML =
        '<div class="answer-title">⚠️ Enter a question first</div>' +
        'Type your homework question above.';

      return;
    }

    answerBox.classList.add("loading");

    answerBox.innerHTML =
      '<div class="answer-title">🌲 Thinking...</div>' +
      'Your AI tutor is working on it.';

    try {

      const response = await fetch("/.netlify/functions/solve", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          question: question,
          subject: selectedSubject
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "The AI could not answer right now."
        );
      }

      answerBox.classList.remove("loading");

      answerBox.innerHTML =
        '<div class="answer-title">💡 Answer</div>' +
        escapeHtml(data.answer);

      saveQuestion(question);

    } catch (error) {

      answerBox.classList.remove("loading");

      answerBox.innerHTML =
        '<div class="answer-title">⚠️ Oops!</div>' +
        escapeHtml(error.message);

    }
  }

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
  }

  function saveQuestion(question) {

    let questions =
      JSON.parse(localStorage.getItem("homeworkQuestions") || "[]");

    questions.unshift(question);

    questions = questions.slice(0, 5);

    localStorage.setItem(
      "homeworkQuestions",
      JSON.stringify(questions)
    );

    showRecentQuestions();
  }

  function showRecentQuestions() {

    const box = document.getElementById("recentQuestions");

    let questions =
      JSON.parse(localStorage.getItem("homeworkQuestions") || "[]");

    box.innerHTML = "";

    questions.forEach(function(question) {

      const item = document.createElement("div");

      item.className = "recent-item";

      item.textContent = question;

      item.onclick = function() {
        document.getElementById("question").value = question;
      };

      box.appendChild(item);

    });
  }

  showRecentQuestions();

</script>

</body>
</html>
